server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Assets com hash no nome: cache longo.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Áudio de fundo: arquivos estáveis, cache de uma semana.
    location /audio/ {
        expires 7d;
        try_files $uri =404;
    }

    # index.html sempre revalidado, para pegar deploys novos.
    location = /index.html {
        expires -1;
    }

    # Fallback de SPA: qualquer rota (ex.: /modulo-01/atividade-03) cai no index.html
    # e o React Router resolve no cliente. Sem isso, recarregar a página dá 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
